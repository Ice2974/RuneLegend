name: Build
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - run: bash ./gradlew build
      - name: Install software graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Run client GameTest
        timeout-minutes: 20
        run: bash ./gradlew runClientGameTest
      - name: Store test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
